
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 32px;
            margin-bottom: 20px;
        }

        table {
            width: 60%;
            margin: 0 auto;
            background-color: #fff;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        td {
            padding: 15px;
            font-size: 18px;
            color: #555;
        }

        th {
            text-align: left;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            font-size: 20px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="submit"],
        input[type="reset"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            margin: 5px;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #45a049;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .radio,
        .checkbox {
            width: auto;
        }

        @media (max-width: 768px) {
            table {
                width: 100%;
            }

            td {
                padding: 10px;
                font-size: 16px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            select,
            textarea {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Registration Form</h1>

    <form action="#" method="post">
        <table>
            <tr>
                <th colspan="2">Personal Information</th>
            </tr>

            <tr>
                <td>
                    <label for="firstname">First Name:</label>
                </td>
                <td>
                    <input
                        type="text"
                        id="firstname"
                        name="firstname"
                        placeholder="Enter your first name"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td>
                    <label for="lastname">Last Name:</label>
                </td>
                <td>
                    <input
                        type="text"
                        id="lastname"
                        name="lastname"
                        placeholder="Enter your last name"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td>
                    <label for="email">Email:</label>
                </td>
                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Password:</label>
                </td>
                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="male"
                        class="radio"
                    >
                    <label for="male">Male</label>

                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="female"
                        class="radio"
                    >
                    <label for="female">Female</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="country">Country:</label>
                </td>
                <td>
                    <select id="country" name="country">
                        <option value="in">India</option>
                        <option value="uk">United Kingdom</option>
                        <option value="us">United States</option>
                        <option value="ca">Canada</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Hobbies:</td>
                <td>
                    <input
                        type="checkbox"
                        id="reading"
                        name="hobbies"
                        value="reading"
                        class="checkbox"
                    >
                    <label for="reading">Reading</label>

                    <input
                        type="checkbox"
                        id="travelling"
                        name="hobbies"
                        value="travelling"
                        class="checkbox"
                    >
                    <label for="travelling">Travelling</label>

                    <input
                        type="checkbox"
                        id="sports"
                        name="hobbies"
                        value="sports"
                        class="checkbox"
                    >
                    <label for="sports">Sports</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="address">Address:</label>
                </td>
                <td>
                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                    ></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
